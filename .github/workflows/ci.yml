name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows offline checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pester suite
        shell: powershell
        run: |
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run release-safety checks
        shell: powershell
        run: .\scripts\windows\Test-MapleBridgeRelease.ps1

  linux:
    name: Linux gateway offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gateway renderer tests
        shell: bash
        run: bash ./tests/linux/GatewayConfig.Tests.sh

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n ./scripts/linux/render-gateway-config.sh
          bash -n ./scripts/linux/configure-gateway.sh
